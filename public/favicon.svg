<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="franceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0055D4" />
      <stop offset="50%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Shield -->
  <rect width="512" height="512" rx="128" fill="#090A10" />
  <rect x="8" y="8" width="496" height="496" rx="120" stroke="url(#franceGrad)" stroke-width="8" stroke-opacity="0.6" />
  
  <!-- Screen Outline -->
  <rect x="86" y="116" width="340" height="230" rx="28" stroke="url(#franceGrad)" stroke-width="20" fill="#11121C" filter="url(#glow)" />
  
  <!-- Stand -->
  <path d="M206 386 L306 386 M256 346 L256 386" stroke="#0055D4" stroke-width="20" stroke-linecap="round" />
  
  <!-- Play Triangle with Signal Rings -->
  <polygon points="220,180 320,231 220,282" fill="url(#franceGrad)" />
  <circle cx="256" cy="231" r="90" stroke="#0055D4" stroke-width="6" stroke-dasharray="16 12" opacity="0.5" />
</svg>
